name: plugin-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix app install
      - run: npm run build
      - run: npm run test
      - run: npm install -g @dbx-app/plugin-cli
      - run: dbx-plugin package .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dbxp
            dist/*.artifact.json

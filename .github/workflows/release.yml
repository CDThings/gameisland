# 官方 CLI 模板同款：Release 发布时由 t8y2/dbx 复用 workflow 构建未签名候选包。
# package-command 需自行带前端构建（ui/ 产物不入 git）：
#   npm --prefix app install && npm --prefix app run build && dbx-plugin package .
name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.10
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: npm --prefix app install && npm --prefix app run build && dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.10
      go-version: ""
      rust-toolchain: ""
      build-matrix: '{"include":[{"runner":"ubuntu-24.04","target":"universal"}]}'
